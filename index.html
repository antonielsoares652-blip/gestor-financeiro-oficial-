<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinançasPro | Dashboard Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
        }

        .clock-font { font-family: 'JetBrains Mono', monospace; }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }
        
        input::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-slate-950/50 backdrop-blur-xl sticky top-0 z-50 border-b border-white/5">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center shadow-indigo-500/20 shadow-lg shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                </div>
                <span class="font-bold text-lg md:text-xl tracking-tight text-white">Finanças<span class="text-indigo-400">Pro</span></span>
            </div>

            <div class="flex items-center gap-2 md:gap-4">
                <div class="clock-font bg-white/5 px-2.5 py-1 rounded-lg border border-white/10 text-indigo-400 text-[11px] md:text-xs font-medium tracking-tighter shadow-inner">
                    <span id="digital-clock">00:00:00</span>
                </div>
                <button onclick="clearAll()" class="text-[9px] md:text-[10px] font-bold text-rose-400 hover:bg-rose-500/10 px-3 py-1.5 rounded-full border border-rose-500/20 transition-all uppercase tracking-widest whitespace-nowrap">
                    Redefinir
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center gap-3 mb-3">
                    <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"/></svg>
                    </div>
                    <span class="text-slate-400 font-medium">Receitas</span>
                </div>
                <h2 id="inc-display" class="text-3xl font-bold text-emerald-400">R$ 0,00</h2>
            </div>

            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center gap-3 mb-3">
                    <div class="p-2 bg-rose-500/10 text-rose-400 rounded-xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6"/></svg>
                    </div>
                    <span class="text-slate-400 font-medium">Despesas</span>
                </div>
                <h2 id="exp-display" class="text-3xl font-bold text-rose-400">R$ 0,00</h2>
            </div>

            <div id="balance-container" class="p-6 rounded-3xl transition-all duration-500 shadow-2xl shadow-indigo-500/10 bg-indigo-600 text-white">
                <div class="flex items-center gap-3 mb-3">
                    <div class="p-2 bg-white/10 rounded-xl text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <span class="text-indigo-100 font-medium">Saldo Disponível</span>
                </div>
                <h2 id="total-display" class="text-3xl font-bold">R$ 0,00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-8 rounded-3xl sticky top-24">
                    <h3 class="text-xl font-bold mb-6 text-white">Nova Transação</h3>
                    <form id="tx-form" class="space-y-5">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2">Descrição</label>
                            <input type="text" id="desc" placeholder="Ex: Salário, Almoço..." required class="w-full p-4 rounded-2xl outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2">Valor (R$)</label>
                            <input type="number" step="0.01" id="val" placeholder="0.00" required class="w-full p-4 rounded-2xl outline-none font-semibold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2">Tipo</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="setType('income')" id="btn-inc" class="py-3 rounded-xl border-2 border-white/5 font-bold transition-all">Entrada</button>
                                <button type="button" onclick="setType('expense')" id="btn-exp" class="py-3 rounded-xl border-2 border-white/5 font-bold transition-all">Saída</button>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-400 text-white font-bold py-5 rounded-2xl shadow-xl shadow-indigo-500/20 transition-all active:scale-[0.98]">
                            Confirmar Transação
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-8">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold text-white">Histórico Recente</h3>
                        <div id="badge-count" class="px-4 py-1 bg-white/5 rounded-full text-xs font-bold text-slate-400 border border-white/10">0</div>
                    </div>
                    <div id="list-container" class="space-y-4"></div>
                    <div id="empty-state" class="hidden text-center py-20 bg-white/5 rounded-3xl border-2 border-dashed border-white/10">
                        <p class="text-slate-500 font-medium">Nenhuma transação encontrada.</p>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-8 text-center shadow-2xl group">
                    <h3 class="text-xl font-bold text-white mb-2">Apoie nosso Projeto!</h3>
                    <p class="text-slate-400 mb-6 max-w-md mx-auto">Gostou da ferramenta? Nos ajude a continuar desenvolvendo.</p>
                    <a href="https://mpago.la/19AkHJN" target="_blank" class="inline-flex items-center justify-center gap-3 bg-[#009EE3] hover:bg-[#007EB5] text-white font-bold py-4 px-8 rounded-2xl shadow-xl transition-all active:scale-[0.95]">
                        Apoiar via Mercado Pago
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('fin_v3')) || [];
        let currentType = 'income';

        // Lógica do Relógio Digital
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digital-clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function setType(t) {
            currentType = t;
            const bInc = document.getElementById('btn-inc');
            const bExp = document.getElementById('btn-exp');
            if(t === 'income') {
                bInc.className = "py-3 rounded-xl border-2 border-emerald-500 bg-emerald-500/10 text-emerald-400 font-bold transition-all";
                bExp.className = "py-3 rounded-xl border-2 border-white/5 font-bold text-slate-500 transition-all";
            } else {
                bExp.className = "py-3 rounded-xl border-2 border-rose-500 bg-rose-500/10 text-rose-400 font-bold transition-all";
                bInc.className = "py-3 rounded-xl border-2 border-white/5 font-bold text-slate-500 transition-all";
            }
        }

        function formatBRL(val) {
            return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function render() {
            const list = document.getElementById('list-container');
            const empty = document.getElementById('empty-state');
            list.innerHTML = '';
            let income = 0, expense = 0;

            if (db.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                db.forEach((item, index) => {
                    const v = parseFloat(item.val);
                    item.type === 'income' ? income += v : expense += v;
                    const div = document.createElement('div');
                    div.className = "glass-card p-5 rounded-2xl flex items-center justify-between";
                    div.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${item.type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                                ${item.type === 'income' ? '↑' : '↓'}
                            </div>
                            <div>
                                <p class="font-bold text-white text-sm md:text-base">${item.desc}</p>
                                <p class="text-[10px] text-slate-500 font-medium">${new Date(item.id).toLocaleDateString('pt-BR')}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-bold text-sm md:text-base ${item.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">${item.type === 'income' ? '+' : '-'} ${formatBRL(v)}</span>
                            <button onclick="del(${index})" class="text-slate-600 hover:text-rose-400 p-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>`;
                    list.appendChild(div);
                });
            }

            const total = income - expense;
            document.getElementById('inc-display').innerText = formatBRL(income);
            document.getElementById('exp-display').innerText = formatBRL(expense);
            document.getElementById('total-display').innerText = formatBRL(total);
            document.getElementById('badge-count').innerText = db.length;

            const container = document.getElementById('balance-container');
            container.className = `p-6 rounded-3xl transition-all duration-500 shadow-2xl ${total < 0 ? 'bg-rose-600 shadow-rose-500/20' : 'bg-indigo-600 shadow-indigo-500/20'} text-white`;

            localStorage.setItem('fin_v3', JSON.stringify(db));
        }

        document.getElementById('tx-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const valInput = document.getElementById('val');
            const descInput = document.getElementById('desc');
            const val = parseFloat(valInput.value);
            if (val <= 0 || isNaN(val)) return alert("Valor inválido");
            db.unshift({ id: Date.now(), desc: descInput.value, val: val, type: currentType });
            descInput.value = ''; valInput.value = '';
            setType('income'); render();
        });

        function del(i) { db.splice(i, 1); render(); }
        function clearAll() { if(confirm("Apagar todos os dados?")) { db = []; render(); } }

        setType('income');
        render();
    </script>
</body>
</html>
