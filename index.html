<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinançasPro | Dashboard & Apoio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s; }
        .card-animate { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-animate:hover { transform: translateY(-4px); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-indigo-200 shadow-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                </div>
                <span class="font-bold text-xl tracking-tight">Finanças<span class="text-indigo-600">Pro</span></span>
            </div>
            <button onclick="clearAll()" class="text-xs font-bold text-rose-500 hover:bg-rose-50 px-4 py-2 rounded-full transition-all">
                REDEFINIR DADOS
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 card-animate shadow-sm">
                <div class="flex items-center gap-3 mb-3">
                    <div class="p-2 bg-emerald-50 text-emerald-600 rounded-xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"/></svg>
                    </div>
                    <span class="text-slate-500 font-medium">Receitas</span>
                </div>
                <h2 id="inc-display" class="text-3xl font-bold text-emerald-600">R$ 0,00</h2>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-slate-200 card-animate shadow-sm">
                <div class="flex items-center gap-3 mb-3">
                    <div class="p-2 bg-rose-50 text-rose-600 rounded-xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6"/></svg>
                    </div>
                    <span class="text-slate-500 font-medium">Despesas</span>
                </div>
                <h2 id="exp-display" class="text-3xl font-bold text-rose-600">R$ 0,00</h2>
            </div>

            <div id="balance-container" class="p-6 rounded-3xl card-animate shadow-lg shadow-indigo-100 bg-indigo-600 text-white">
                <div class="flex items-center gap-3 mb-3">
                    <div class="p-2 bg-white/20 rounded-xl text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <span class="text-indigo-100 font-medium">Saldo Disponível</span>
                </div>
                <h2 id="total-display" class="text-3xl font-bold">R$ 0,00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm sticky top-24">
                    <h3 class="text-xl font-bold mb-6">Nova Transação</h3>
                    <form id="tx-form" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Descrição</label>
                            <input type="text" id="desc" placeholder="Ex: Salário, Almoço..." required class="w-full bg-slate-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Valor (R$)</label>
                            <input type="number" step="0.01" id="val" placeholder="0.00" required class="w-full bg-slate-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none font-semibold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Tipo</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="setType('income')" id="btn-inc" class="py-3 rounded-xl border-2 border-slate-100 font-bold transition-all">Entrada</button>
                                <button type="button" onclick="setType('expense')" id="btn-exp" class="py-3 rounded-xl border-2 border-slate-100 font-bold transition-all">Saída</button>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl transition-all active:scale-[0.98]">
                            Confirmar Transação
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-8">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold">Histórico Recente</h3>
                        <div id="badge-count" class="px-4 py-1 bg-slate-200 rounded-full text-xs font-bold text-slate-600">0</div>
                    </div>
                    
                    <div id="list-container" class="space-y-4">
                        </div>

                    <div id="empty-state" class="hidden text-center py-20 bg-slate-100/50 rounded-3xl border-2 border-dashed border-slate-200">
                        <p class="text-slate-400 font-medium">Nenhuma transação encontrada.</p>
                    </div>
                </div>

                <div class="bg-indigo-50 border border-indigo-100 rounded-3xl p-8 text-center shadow-sm card-animate">
                    <div class="inline-flex items-center justify-center w-12 h-12 bg-white rounded-full mb-4 shadow-sm">
                        <span class="text-2xl">🚀</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Apoie nosso Projeto!</h3>
                    <p class="text-slate-600 mb-6 max-w-md mx-auto">Gostou da ferramenta? Nos ajude a continuar desenvolvendo novas funções apoiando via Mercado Pago.</p>
                    
                    <a href="https://mpago.la/19AkHJN" target="_blank" 
                       class="inline-flex items-center justify-center gap-3 bg-[#009EE3] hover:bg-[#007EB5] text-white font-bold py-4 px-8 rounded-2xl shadow-xl shadow-blue-200 transition-all active:scale-[0.95] group">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.82v-1.91c-1.3-.12-2.58-.52-3.71-1.22l.85-2.27c1.12.65 2.3 1.01 3.48 1.05.76 0 1.25-.21 1.25-.71 0-.34-.23-.61-1.16-.94l-1.07-.38c-1.74-.63-2.65-1.57-2.65-3.04 0-1.63 1.15-2.78 2.97-3.09V5.5h2.82v1.94c1.12.11 2.21.43 3.16.92l-.84 2.22c-.93-.45-1.91-.71-2.9-.74-.82 0-1.24.23-1.24.69 0 .37.29.61 1.23.95l1.07.38c1.88.67 2.76 1.7 2.76 3.12.01 1.69-1.21 2.87-3.13 3.12z"/>
                        </svg>
                        Apoiar via Mercado Pago
                    </a>
                </div>
            </div>
        </div>
    </main>

    <a href="https://mpago.la/19AkHJN" target="_blank" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-[#009EE3] text-white rounded-full flex items-center justify-center shadow-2xl z-50 animate-bounce">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </a>

    <script>
        let db = JSON.parse(localStorage.getItem('fin_v3')) || [];
        let currentType = 'income';

        function setType(t) {
            currentType = t;
            const bInc = document.getElementById('btn-inc');
            const bExp = document.getElementById('btn-exp');
            
            if(t === 'income') {
                bInc.className = "py-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-600 font-bold transition-all";
                bExp.className = "py-3 rounded-xl border-2 border-slate-100 font-bold text-slate-400 transition-all";
            } else {
                bExp.className = "py-3 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-600 font-bold transition-all";
                bInc.className = "py-3 rounded-xl border-2 border-slate-100 font-bold text-slate-400 transition-all";
            }
        }

        function formatBRL(val) {
            return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function render() {
            const list = document.getElementById('list-container');
            const empty = document.getElementById('empty-state');
            list.innerHTML = '';

            let income = 0, expense = 0;

            if (db.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                db.forEach((item, index) => {
                    const v = parseFloat(item.val);
                    item.type === 'income' ? income += v : expense += v;

                    const div = document.createElement('div');
                    div.className = "bg-white p-5 rounded-2xl border border-slate-200 flex items-center justify-between card-animate";
                    div.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${item.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                                ${item.type === 'income' ? '↑' : '↓'}
                            </div>
                            <div>
                                <p class="font-bold text-slate-800">${item.desc}</p>
                                <p class="text-xs text-slate-400 font-medium">${new Date(item.id).toLocaleDateString('pt-BR')}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-bold ${item.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                                ${item.type === 'income' ? '+' : '-'} ${formatBRL(v)}
                            </span>
                            <button onclick="del(${index})" class="text-slate-300 hover:text-rose-500 transition-colors p-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }

            const total = income - expense;
            document.getElementById('inc-display').innerText = formatBRL(income);
            document.getElementById('exp-display').innerText = formatBRL(expense);
            document.getElementById('total-display').innerText = formatBRL(total);
            document.getElementById('badge-count').innerText = db.length;

            const container = document.getElementById('balance-container');
            if(total < 0) {
                container.classList.replace('bg-indigo-600', 'bg-rose-600');
                container.classList.replace('shadow-indigo-100', 'shadow-rose-100');
            } else {
                container.classList.replace('bg-rose-600', 'bg-indigo-600');
                container.classList.replace('shadow-rose-100', 'shadow-indigo-100');
            }

            localStorage.setItem('fin_v3', JSON.stringify(db));
        }

        document.getElementById('tx-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const valInput = document.getElementById('val');
            const descInput = document.getElementById('desc');
            const val = parseFloat(valInput.value);
            
            if (val <= 0 || isNaN(val)) return alert("Insira um valor válido");

            db.unshift({
                id: Date.now(),
                desc: descInput.value,
                val: val,
                type: currentType
            });

            descInput.value = '';
            valInput.value = '';
            setType('income');
            render();
        });

        function del(i) {
            db.splice(i, 1);
            render();
        }

        function clearAll() {
            if(confirm("Deseja apagar todos os dados permanentemente?")) {
                db = [];
                render();
            }
        }

        // Setup inicial
        setType('income');
        render();
    </script>
</body>
</html>
